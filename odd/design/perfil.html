<!DOCTYPE html>
<html lang="es-MX">
<body>
<x-dc>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F2F4F7; color: #0F172A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <main style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 8px 16px 112px">
    <div style="height: 44px; display: flex; align-items: center; justify-content: flex-end">
      <button type="button" aria-label="Ayuda" sc-camel-on-click="{{ openHelp }}" style="width: 44px; height: 44px; margin-right: -6px; display: flex; align-items: center; justify-content: center; padding: 0; background: none; border: 0; color: #0F172A; ">
        <span style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.07); border-radius: 50%">
          <svg M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3 M12 17h.01/>
        </span>
      </button>
    </div>
    <h1 style="margin: 0 4px 18px; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Perfil</h1>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #FFFFFF; border-radius: 16px">
      <span style="flex: none; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: #0F172A; color: #FFFFFF; border-radius: 50%; font-size: 19px; line-height: 24px; font-weight: 800">{{ initials }}</span>
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 20px; line-height: 26px; font-weight: 800">{{ clientName }}</span>
        <span style="font-size: 15px; line-height: 20px; font-weight: 500; color: #45464D">{{ savedPhone }}</span>
      </span>
    </div>
    <h2 id="perfil-celular" style="margin: 24px 16px 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: #45464D">Celular</h2>
    <div role="group" aria-labelledby="perfil-celular" style="overflow: hidden; background: #FFFFFF; border-radius: 16px">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px">
        <span style="flex: none; width: 96px; font-size: 17px; line-height: 22px; font-weight: 600; color: {{ phoneLabelColor }}">Número</span>
        <input type="tel" placeholder="998 123 4567" value="{{ phone }}" sc-camel-on-change="{{ onPhone }}" aria-invalid="{{ phoneInvalid }}" style="flex: 1; min-width: 0; height: 52px; padding: 0; border: 0; outline: none; background: transparent; color: #0F172A; font-size: 17px; line-height: 22px; font-weight: 600">
      </label>
    </div>
    <p style="margin: 8px 16px 0; font-size: 13px; line-height: 18px; color: #45464D">Con este número entras y te avisamos por WhatsApp.</p>
    <h2 id="perfil-nip" style="margin: 24px 16px 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: #45464D">NIP</h2>
    <div role="group" aria-labelledby="perfil-nip" style="overflow: hidden; background: #FFFFFF; border-radius: 16px">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px">
        <span style="flex: none; width: 96px; font-size: 17px; line-height: 22px; font-weight: 600; color: {{ currentLabelColor }}">Actual</span>
        <input type="password" maxlength="4" placeholder="4 dígitos" value="{{ currentNip }}" sc-camel-on-change="{{ onCurrentNip }}" aria-invalid="{{ currentInvalid }}" style="flex: 1; min-width: 0; height: 52px; padding: 0; border: 0; outline: none; background: transparent; color: #0F172A; font-size: 17px; line-height: 22px; font-weight: 600">
      </label>
      <span style="display: block; height: 1px; margin-left: 16px; background: rgba(15, 23, 42, 0.1)"></span>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px">
        <span style="flex: none; width: 96px; font-size: 17px; line-height: 22px; font-weight: 600; color: {{ newLabelColor }}">Nuevo</span>
        <input type="password" maxlength="4" placeholder="4 dígitos" value="{{ newNip }}" sc-camel-on-change="{{ onNewNip }}" aria-invalid="{{ newInvalid }}" style="flex: 1; min-width: 0; height: 52px; padding: 0; border: 0; outline: none; background: transparent; color: #0F172A; font-size: 17px; line-height: 22px; font-weight: 600">
      </label>
    </div>
    <p style="margin: 8px 16px 0; font-size: 13px; line-height: 18px; color: #45464D">No es para pagar. Déjalo vacío si no lo cambias.</p>
    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px">
      <sc-if value="{{ hasError }}">
        <p role="alert" style="margin: 0; text-align: center; font-size: 13px; line-height: 18px; font-weight: 700; color: #B91C1C">{{ errorMessage }}</p>
      </sc-if>
      <sc-if value="{{ wasSaved }}">
        <p role="status" style="min-height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; padding: 0 12px; background: rgba(15, 23, 42, 0.06); border-radius: 14px; font-size: 15px; line-height: 20px; font-weight: 700">
          <svg M20 6 9 17l-5-5/>
          <span>Guardamos tus cambios</span>
        </p>
      </sc-if>
      <sc-if value="{{ canSave }}">
        <button type="button" sc-camel-on-click="{{ onSave }}" style="width: 100%; min-height: 52px; background: #0F172A; color: #FFFFFF; border: 0; border-radius: 14px; font-size: 17px; line-height: 22px; font-weight: 700; transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1)" style-active="transform: scale(0.97)">Guardar cambios</button>
      </sc-if>
    </div>
    <div style="margin-top: 24px; overflow: hidden; background: #FFFFFF; border-radius: 16px">
      <a href="AppleEntrada.dc.html" style="min-height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #DC2626; font-size: 17px; line-height: 22px; font-weight: 600; text-decoration: none; transition: background-color 160ms ease" style-active="background-color: #E9ECF1">Cerrar sesión</a>
    </div>
  </main>
  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding: 0 12px 34px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; background: {{ materialBackground }}; backdrop-filter: {{ materialBlur }}; -webkit-backdrop-filter: {{ materialBlur }}; border-top: 1px solid rgba(15, 23, 42, 0.08)">
    <a href="ApplePedidos.dc.html" style="display: flex; justify-content: center; color: #45464D; text-decoration: none">
      <span style="min-width: 96px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600">
        <svg M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V M8 8h8M8 12h8M8 16h/>
        <span>Pedidos</span>
      </span>
    </a>
    <a href="AppleServicios.dc.html" style="display: flex; justify-content: center; color: #45464D; text-decoration: none">
      <span style="min-width: 96px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600">
        <svg M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0  M7.5 7.5h.01/>
        <span>Servicios</span>
      </span>
    </a>
    <a href="ApplePerfil.dc.html" aria-current="page" style="display: flex; justify-content: center; color: #0F172A; text-decoration: none">
      <span style="min-width: 96px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; background: rgba(15, 23, 42, 0.09); border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 800">
        <svg M4 21a8 8 0 0 1 16 0/>
        <span>Perfil</span>
      </span>
    </a>
  </nav>
  <sc-if value="{{ helpOpen }}">
    <div style="position: absolute; inset: 0; z-index: 5">
      <dc-import name="AppleAyuda" on-cerrar="{{ closeHelp }}"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  // The panel's sample client of ticket 7720. The demo NIP is 2580.
  clientName = 'Carlos Ruiz';
  demoNip = '2580';
  nipLength = 4;
  state = {
    savedPhone: '998 123 4567',
    phone: '998 123 4567',
    currentNip: '',
    newNip: '',
    errorField: '',
    errorMessage: '',
    wasSaved: false,
    helpOpen: false,
  };
  renderVals() {
    const { errorField } = this.state;
    return {
      clientName: this.clientName,
      initials: this.initialsOf(this.clientName),
      savedPhone: this.state.savedPhone,
      phone: this.state.phone,
      currentNip: this.state.currentNip,
      newNip: this.state.newNip,
      phoneInvalid: errorField === 'phone' ? 'true' : 'false',
      currentInvalid: errorField === 'current' ? 'true' : 'false',
      newInvalid: errorField === 'new' ? 'true' : 'false',
      phoneLabelColor: this.labelColor('phone'),
      currentLabelColor: this.labelColor('current'),
      newLabelColor: this.labelColor('new'),
      hasError: errorField !== '',
      errorMessage: this.state.errorMessage,
      wasSaved: this.state.wasSaved,
      canSave: !this.state.wasSaved,
      helpOpen: this.state.helpOpen,
      ...this.material(),
      onPhone: this.onPhone,
      onCurrentNip: this.onCurrentNip,
      onNewNip: this.onNewNip,
      onSave: this.onSave,
      openHelp: this.openHelp,
      closeHelp: this.closeHelp,
    };
  }
  initialsOf(name) {
    return name.split(' ').map((word) => word[0]).join('').slice(0, 2);
  }
  labelColor(field) {
    return this.state.errorField === field ? '#B91C1C' : '#0F172A';
  }
  // One message for whichever field needs attention first; changing the NIP is optional.
  validationError() {
    const { phone, currentNip, newNip } = this.state;
    if (phone.replace(/\D/g, '').length !== 10) return { field: 'phone', message: 'Escribe tu celular a 10 dígitos.' };
    const changesNip = currentNip !== '' || newNip !== '';
    if (!changesNip) return null;
    if (currentNip !== this.demoNip) return { field: 'current', message: 'Tu NIP actual no coincide.' };
    if (newNip.length !== this.nipLength) return { field: 'new', message: 'El NIP nuevo necesita 4 dígitos.' };
    if (newNip === currentNip) return { field: 'new', message: 'El NIP nuevo debe ser distinto del actual.' };
    return null;
  }
  // Translucent tab bar, solid when the person asks for less transparency.
  material() {
    const isSolid = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-transparency: reduce)').matches;
    return {
      materialBackground: isSolid ? '#FFFFFF' : 'rgba(248, 250, 252, 0.78)',
      materialBlur: isSolid ? 'none' : 'blur(20px) saturate(180%)',
    };
  }
  onPhone = (event) => {
    const digits = event.target.value.replace(/\D/g, '').slice(0, 10);
    const phone = [digits.slice(0, 3), digits.slice(3, 6), digits.slice(6)].filter(Boolean).join(' ');
    this.setState({ phone, errorField: '', wasSaved: false });
  };
  onCurrentNip = (event) => this.setState({ currentNip: event.target.value.replace(/\D/g, '').slice(0, 4), errorField: '', wasSaved: false });
  onNewNip = (event) => this.setState({ newNip: event.target.value.replace(/\D/g, '').slice(0, 4), errorField: '', wasSaved: false });
  onSave = () => {
    const error = this.validationError();
    if (error) {
      this.setState({ errorField: error.field, errorMessage: error.message });
      return;
    }
    this.setState({ savedPhone: this.state.phone, currentNip: '', newNip: '', wasSaved: true });
  };
  openHelp = () => this.setState({ helpOpen: true });
  closeHelp = () => this.setState({ helpOpen: false });
}
</script>
</body></html>
