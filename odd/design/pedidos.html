<!DOCTYPE html>
<html lang="es-MX">
<body>
<x-dc>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F2F4F7; color: #0F172A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <main style="height: 100%; overflow-y: auto; box-sizing: border-box; padding: 8px 16px 112px">
    <div style="height: 44px; display: flex; align-items: center; justify-content: flex-end">
      <button type="button" aria-label="Ayuda" sc-camel-on-click="{{ openHelp }}" style="width: 44px; height: 44px; margin-right: -6px; display: flex; align-items: center; justify-content: center; padding: 0; background: none; border: 0; color: #0F172A; ">
        <span style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.07); border-radius: 50%">
          <svg M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3 M12 17h.01/>
        </span>
      </button>
    </div>
    <h1 style="margin: 0 4px 18px; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">Pedidos</h1>
    <h2 style="margin: 0 16px 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: #45464D">Activos</h2>
    <ul style="list-style: none; margin: 0; padding: 0; overflow: hidden; background: #FFFFFF; border-radius: 16px">
      <sc-for list="{{ activeOrders }}" as="order" hint-placeholder-count="3">
        <li style="border-top: {{ order.divider }}; margin-left: {{ order.dividerInset }}">
          <a href="{{ order.href }}" style="min-height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; margin-left: {{ order.rowOffset }}; padding: 10px 12px 10px 14px; color: #0F172A; text-decoration: none; transition: background-color 160ms ease" style-active="background-color: #E9ECF1">
            <span style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: {{ order.dot }}; box-shadow: {{ order.dotRing }}"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 17px; line-height: 22px; font-weight: 600">{{ order.work }}</span>
              <span style="font-size: 15px; line-height: 20px; font-weight: {{ order.statusWeight }}; color: {{ order.statusColor }}">{{ order.status }}</span>
            </span>
            <svg m9 18 6-6-6-6/>
          </a>
        </li>
      </sc-for>
    </ul>
    <h2 style="margin: 24px 16px 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: #45464D">Entregados</h2>
    <ul style="list-style: none; margin: 0; padding: 0; overflow: hidden; background: #FFFFFF; border-radius: 16px">
      <sc-for list="{{ pastOrders }}" as="order" hint-placeholder-count="1">
        <li style="min-height: 60px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 10px 16px; border-top: {{ order.divider }}">
          <span style="font-size: 17px; line-height: 22px; font-weight: 600; color: #45464D">{{ order.work }}</span>
          <span style="font-size: 15px; line-height: 20px; color: #45464D">{{ order.status }}</span>
        </li>
      </sc-for>
    </ul>
    <a href="AppleServicios.dc.html" style="margin-top: 24px; min-height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(15, 23, 42, 0.06); color: #0F172A; border-radius: 14px; font-size: 17px; line-height: 22px; font-weight: 700; text-decoration: none; transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1)" style-active="transform: scale(0.97)">
      <svg M12 5v14M5 12h14/>
      <span>Agendar una cita</span>
    </a>
  </main>
  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding: 0 12px 34px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; background: {{ materialBackground }}; backdrop-filter: {{ materialBlur }}; -webkit-backdrop-filter: {{ materialBlur }}; border-top: 1px solid rgba(15, 23, 42, 0.08)">
    <a href="ApplePedidos.dc.html" aria-current="page" style="display: flex; justify-content: center; color: #0F172A; text-decoration: none">
      <span style="min-width: 96px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; background: rgba(15, 23, 42, 0.09); border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 800">
        <svg M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V M8 8h8M8 12h8M8 16h/>
        <span>Pedidos</span>
      </span>
    </a>
    <a href="AppleServicios.dc.html" style="display: flex; justify-content: center; color: #45464D; text-decoration: none">
      <span style="min-width: 96px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600">
        <svg M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0  M7.5 7.5h.01/>
        <span>Servicios</span>
      </span>
    </a>
    <a href="ApplePerfil.dc.html" style="display: flex; justify-content: center; color: #45464D; text-decoration: none">
      <span style="min-width: 96px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 16px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600">
        <svg M4 21a8 8 0 0 1 16 0/>
        <span>Perfil</span>
      </span>
    </a>
  </nav>
  <sc-if value="{{ helpOpen }}">
    <div style="position: absolute; inset: 0; z-index: 5">
      <dc-import name="AppleAyuda" on-cerrar="{{ closeHelp }}"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { helpOpen: false };
  // The demo client's orders, the one that needs the client first.
  activeOrders = [
    { work: 'Cambio de cierre de chamarra', status: 'Listo para recoger', href: 'ApplePedido.dc.html', needsClient: true },
    { work: 'Ajuste de cintura', status: 'Cita agendada', href: 'ApplePedidoCita.dc.html', needsClient: false },
    { work: 'Ajuste de vestido de novia', status: 'En proceso', href: 'ApplePedidoProceso.dc.html', needsClient: false },
  ];
  pastOrders = [
    { work: 'Dobladillo de pantalón', status: 'Entregado el 12 de octubre' },
  ];
  renderVals() {
    return {
      activeOrders: this.activeOrders.map((order, index) => this.toActiveRow(order, index)),
      pastOrders: this.pastOrders.map((order, index) => ({ ...order, divider: this.dividerFor(index) })),
      helpOpen: this.state.helpOpen,
      ...this.material(),
      openHelp: this.openHelp,
      closeHelp: this.closeHelp,
    };
  }
  // A ready order stands out with a filled dot and bold status; the rest use an outlined dot.
  toActiveRow(order, index) {
    const isFirst = index === 0;
    return {
      ...order,
      divider: this.dividerFor(index),
      dividerInset: isFirst ? '0' : '36px',
      rowOffset: isFirst ? '0' : '-36px',
      dot: order.needsClient ? '#0F172A' : 'transparent',
      dotRing: order.needsClient ? 'none' : 'inset 0 0 0 2px #9AA1AC',
      statusWeight: order.needsClient ? 700 : 500,
      statusColor: order.needsClient ? '#0F172A' : '#45464D',
    };
  }
  dividerFor(index) {
    return index === 0 ? '0' : '1px solid rgba(15, 23, 42, 0.1)';
  }
  // Translucent tab bar, solid when the person asks for less transparency.
  material() {
    const isSolid = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-transparency: reduce)').matches;
    return {
      materialBackground: isSolid ? '#FFFFFF' : 'rgba(248, 250, 252, 0.78)',
      materialBlur: isSolid ? 'none' : 'blur(20px) saturate(180%)',
    };
  }
  openHelp = () => this.setState({ helpOpen: true });
  closeHelp = () => this.setState({ helpOpen: false });
}
</script>
</body></html>
